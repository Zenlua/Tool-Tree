name: Plugin CI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/plugin/**'

permissions: write-all

jobs:
  build-release:
    if: ${{ github.repository_owner == 'Zenlua' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: |
          VER=$(grep -m1 'versionName ' app/build.gradle | cut -d'"' -f2)
          cd .github/plugin
          find . -exec touch -d "2026-01-01 00:00:00" {} +
          7z a -t7z -mmt=off -mtc=off -mta=off -y ../plugin_$VER.so

      - name: Upload module
        uses: softprops/action-gh-release@v2
        with:
          name: "Tmp"
          tag_name: "V1"
          files: .github/plugin_*.so