name: Upload add-on

on:
  workflow_dispatch:
    inputs:
      KEYAC:
        description: 'Delete ID'
        required: false
        default: ''
  schedule:
    - cron: '0 */12 * * *'
permissions: write-all
env:
    UP_TOKEN: ${{ secrets.UP_TOKEN }}
    GH_TOKEN: ${{ github.token }}
    KEYAC: ${{ inputs.KEYAC }}
jobs:
  build-release:
    if: ${{ github.repository_owner == 'Kakathic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download add-on
        run: |
          chmod +x ./.github/upload.bash
          . ./.github/upload.bash
      - name: Upload file
        uses: softprops/action-gh-release@v2
        with:
          name: "Tmp"
          tag_name: "V1"
          files: |
            Up/UZE.zip
            addon.log
      - name: Upload add-on
        uses: softprops/action-gh-release@v2
        with:
          name: "Add-on"
          tag_name: "V1.0.2"
          files: Add/*.7z
          