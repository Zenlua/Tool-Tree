<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Tool-Tree</title>
<style>
  :root {
    color-scheme: light dark;
    --dot: rgba(99, 102, 241, 0.18);
    --glow: rgba(99, 102, 241, 0.35);
    --g1: #059669;
    --g2: #0284c7;
    --g3: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --dot: rgba(56, 189, 248, 0.22);
      --glow: rgba(14, 165, 233, 0.55);
      --g1: #34d399;
      --g2: #06b6d4;
      --g3: #818cf8;
    }
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, var(--dot) 1.3px, transparent 1.6px);
    background-size: 10px 10px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, transparent 78%);
    mask-image: radial-gradient(ellipse at center, #000 35%, transparent 78%);
  }

  .logo {
    position: relative;
    font-size: min(68vh, 16.5vw);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .logo span {
    display: block;
  }

  .glow {
    position: absolute;
    inset: 0;
    color: var(--glow);
    filter: blur(10px);
  }

  .text {
    position: relative;
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3), var(--g1));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: slide 6s linear infinite;
  }

  @keyframes slide {
    to { background-position: -300% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .text { animation: none; }
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="logo">
    <span class="glow" aria-hidden="true">Tool-Tree</span>
    <span class="text">Tool-Tree</span>
  </div>
</body>
</html>
