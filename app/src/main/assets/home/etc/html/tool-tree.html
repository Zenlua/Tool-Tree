<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Tool-Tree</title>
<style>
  :root {
    color-scheme: light dark;
    --g1: #10c98f;
    --g2: #0ea5e9;
    --g3: #a78bfa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --g1: #34d399;
      --g2: #06b6d4;
      --g3: #818cf8;
    }
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .logo {
    position: relative;
    z-index: 2;
    font-size: min(68vh, 16.5vw);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .gt {
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }

  .halo {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: blur(12px);
    opacity: 0.5;
    animation: breathe 4s ease-in-out infinite alternate;
  }

  @keyframes breathe {
    to { opacity: 1; transform: scale(1.04); }
  }

  .p i {
    position: absolute;
    bottom: -6px;
    left: var(--l);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--g2);
    opacity: 0;
    animation: rise var(--d) linear var(--s) infinite;
    will-change: transform, opacity;
  }

  @keyframes rise {
    0%   { transform: translateY(0); opacity: 0; }
    15%  { opacity: 0.9; }
    100% { transform: translateY(-105vh); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .halo, .p i { animation: none; }
  }
</style>
</head>
<body>
  <div class="halo" aria-hidden="true"><span class="logo gt">Tool-Tree</span></div>
  <div class="p" aria-hidden="true">
    <i style="--l:8%;--d:5s;--s:-1s"></i>
    <i style="--l:19%;--d:6.5s;--s:-3s"></i>
    <i style="--l:31%;--d:5.5s;--s:-2s"></i>
    <i style="--l:44%;--d:7s;--s:-5s"></i>
    <i style="--l:57%;--d:5s;--s:-4s"></i>
    <i style="--l:69%;--d:6s;--s:-1.5s"></i>
    <i style="--l:81%;--d:7.5s;--s:-3.5s"></i>
    <i style="--l:92%;--d:5.8s;--s:-2.5s"></i>
  </div>
  <div class="logo gt">Tool-Tree</div>
</body>
</html>
